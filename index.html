<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title">NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load the fonts without making the page wait for them -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;600;800&family=Orbitron:wght@600&family=Space+Grotesk:wght@500;700&display=swap" as="style" onload="this.onload = null; this.rel = 'stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;600;800&family=Orbitron:wght@600&family=Space+Grotesk:wght@500;700&display=swap" /></noscript>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <!-- Animated space background, drawn by script.js: a journey through space.
       The stars sit behind the scenes so planets can pass in front of them.
       The plain .nebula layer only shows on browsers that can't draw the animated one. -->
  <div class="space-bg" aria-hidden="true">
    <div class="nebula"></div>
    <canvas id="starfield"></canvas>
    <canvas id="nebulaCanvas"></canvas>
  </div>

  <header class="site-header">
    <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />

    <!-- Language picker. Arabic and Hebrew switch the page to read right-to-left. -->
    <label class="language-picker">
      <span class="visually-hidden" data-i18n="language">Language</span>
      <select id="languageSelect">
        <option value="en" lang="en">English</option>
        <option value="es" lang="es">Español</option>
        <option value="ar" lang="ar">العربية</option>
        <option value="he" lang="he">עברית</option>
      </select>
    </label>
  </header>

  <div class="container">
    <div class="hero">
      <p class="tag" data-i18n="tag">Astronomy Picture of the Day</p>
      <h1 data-i18n="heading">Space Explorer</h1>
      <p class="hero-text" data-i18n="heroText">Pick any dates since 1995 and see what NASA shared from across the cosmos.</p>
    </div>

    <form class="filters" id="dateForm">
      <div class="field">
        <label for="startDate" data-i18n="startDate">Start date</label>
        <input type="date" id="startDate" required />
      </div>
      <div class="field">
        <label for="endDate" data-i18n="endDate">End date</label>
        <input type="date" id="endDate" required />
      </div>
      <button type="submit" id="getImagesButton" data-i18n="getImages">Get Space Images</button>
    </form>

    <!-- Rotating space facts (filled in by script.js, starting with a random fact on each load) -->
    <section class="space-fact" id="spaceFact" aria-labelledby="factHeading">
      <!-- The panel's own little sky: two layers of stars and a passing comet -->
      <div class="fact-sky" aria-hidden="true">
        <span class="fact-stars"></span>
        <span class="fact-stars far"></span>
        <span class="fact-comet"></span>
      </div>
      <div class="fact-top">
        <div class="fact-title">
          <span class="live-dot"></span>
          <h2 id="factHeading">Did You Know?</h2>
        </div>
        <button type="button" id="factPause" class="fact-pause"></button>
      </div>
      <div class="fact-body">
        <p id="factText"></p>
      </div>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p data-i18n="placeholder">Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal: <dialog> gives us Esc-to-close and keeps keyboard focus inside for free -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button type="button" id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-text">
        <p id="modalDate" class="date"></p>
        <h2 id="modalTitle" lang="en" dir="ltr"></h2>
        <p id="modalCredit" class="credit"></p>
        <p id="modalExplanation" class="explanation" lang="en" dir="ltr"></p>
        <p id="modalLink" class="modal-link"></p>
      </div>
    </div>
  </dialog>

  <!-- The Big Bang plays on this canvas, on top of the page, the first time images load -->
  <canvas id="bigBangCanvas" class="big-bang" aria-hidden="true" hidden></canvas>

  <!-- "defer" lets the page show first, then runs these in order -->
  <script src="js/dateRange.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
