<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <form class="filters" id="dateForm">
      <div class="field">
        <label for="startDate">Start date</label>
        <input type="date" id="startDate" required />
      </div>
      <div class="field">
        <label for="endDate">End date</label>
        <input type="date" id="endDate" required />
      </div>
      <button type="submit" id="getImagesButton">Get Space Images</button>
    </form>

    <!-- Random space fact (filled in by script.js each time the page loads) -->
    <section class="space-fact" aria-labelledby="factHeading">
      <h2 id="factHeading">Did You Know?</h2>
      <p id="factText"></p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal: <dialog> gives us Esc-to-close and keeps keyboard focus inside for free -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button type="button" id="modalClose" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-text">
        <p id="modalDate" class="date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalCredit" class="credit"></p>
        <p id="modalExplanation" class="explanation"></p>
        <p id="modalLink" class="modal-link"></p>
      </div>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
